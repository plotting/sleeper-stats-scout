name: Fit trade values

# Refits trade values from the trades already stored (scripts/fit-trade-values.ts) without
# crawling. The crawl workflow also runs this after it finishes; use this one to refit on demand,
# e.g. after changing the model, or while a long crawl is still running.
on:
  workflow_dispatch:

concurrency:
  group: fit-trade-values
  cancel-in-progress: false

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/fit-trade-values.ts
        env:
          TSX_TSCONFIG_PATH: tsconfig.app.json
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
