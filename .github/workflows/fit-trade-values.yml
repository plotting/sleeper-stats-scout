name: Fit trade values

# Refits trade values from the trades already stored (scripts/fit-trade-values.ts) without
# crawling. Runs daily (recent trades count more, so values drift as the market moves); the crawl
# workflow also runs it after it finishes. Run it by hand to refit on demand, e.g. after changing
# the model, or while a long crawl is still running.
on:
  schedule:
    - cron: '37 9 * * *' # daily, early morning US time, so the calculator values stay fresh
  workflow_dispatch:
    inputs:
      depth_players:
        description: 'Weight of each extra player on a side, richest first (1 = plain sum)'
        default: '1'
      depth_picks:
        description: 'Weight of each extra pick on a side'
        default: '1'
      sweep:
        description: 'Experiment only: fit on older trades with several recency half-lives and windows, score the newest trades, print a table, store nothing'
        type: boolean
        default: false
      sweep_half_lives:
        description: 'Sweep only: recency half-lives in days, comma separated (100000 = none)'
        default: '60,120,240,100000'
      sweep_windows:
        description: 'Sweep only: windows in days, comma separated'
        default: '270,548,900'
      sweep_offset:
        description: 'Sweep only: end the test period this many days ago (to check another time of year)'
        default: '0'

concurrency:
  group: fit-trade-values
  cancel-in-progress: false

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/fit-trade-values.ts
        env:
          TSX_TSCONFIG_PATH: tsconfig.app.json
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEPTH_PLAYERS: ${{ inputs.depth_players || '1' }}
          DEPTH_PICKS: ${{ inputs.depth_picks || '1' }}
          SWEEP: ${{ inputs.sweep && '1' || '' }}
          SWEEP_HALF_LIVES: ${{ inputs.sweep_half_lives || '60,120,240,100000' }}
          SWEEP_WINDOWS: ${{ inputs.sweep_windows || '270,548,900' }}
          TEST_OFFSET_DAYS: ${{ inputs.sweep_offset || '0' }}
